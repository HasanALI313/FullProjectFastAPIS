name: Branch policy

on:
  pull_request:
    branches:
      - dev
      - main
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  branch-direction:
    name: branch-direction
    runs-on: ubuntu-latest
    steps:
      - name: Validate pull-request source and target
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$BASE_BRANCH" == "main" && "$HEAD_BRANCH" != "dev" ]]; then
            echo "Only dev may be merged into main. Received: $HEAD_BRANCH -> $BASE_BRANCH"
            exit 1
          fi

          if [[ "$BASE_BRANCH" == "dev" && ! "$HEAD_BRANCH" =~ ^feature/[a-zA-Z0-9._-]+$ ]]; then
            echo "Only feature/* branches may be merged into dev. Received: $HEAD_BRANCH -> $BASE_BRANCH"
            exit 1
          fi

          echo "Allowed branch flow: $HEAD_BRANCH -> $BASE_BRANCH"
