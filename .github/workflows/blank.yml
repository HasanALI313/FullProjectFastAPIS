name: CI

on:
  # Run when commits are pushed to main or dev.
  push:
    branches:
      - main
      - dev

  # Run when a pull request targets main or dev.
  pull_request:
    branches:
      - main
      - dev

  # Allow manual execution from the GitHub Actions page.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Download the repository.
      - name: Check out repository
        uses: actions/checkout@v4

      # Replace this with your actual build command.
      - name: Build
        run: echo "Building project..."

      # Replace this with your actual test command.
      - name: Test
        run: echo "Running tests..."

      - name: Complete
        run: echo "CI completed successfully."